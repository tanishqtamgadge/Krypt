services:
  - type: web
    name: krypt-secure-file-sharing
    runtime: node
    plan: starter
    buildCommand: npm install && npm run client:build
    startCommand: npm start
    disk:
      name: krypt-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/data
      - key: SESSION_SECRET
        generateValue: true
